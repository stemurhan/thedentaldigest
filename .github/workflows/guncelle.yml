name: Bulten guncelle

on:
  schedule:
    # 2 saatte bir (kalabalik olmayan dakikada): oranlar, sonuclar ve kuponlar daha taze kalir
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:               # betik veya is akisi degisince de calis
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: write          # sonuclandirma zinciri durduysa yeniden baslatmak icin

concurrency:
  group: bulten
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Onbellek (gecmis maclar, kadrolar, ceviriler)
        uses: actions/cache@v4
        with:
          path: .cache
          key: bulten-cache-${{ github.run_id }}
          restore-keys: bulten-cache-
      - name: Site dosyalarini denetle (JavaScript sozdizimi)
        run: |
          node --check js/app.js
          node --check js/i18n.js
          node --check js/config.js
          node --check sw.js
      - name: Bulteni guncelle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update.py
      - name: Uretilen veriyi denetle (bozuk veri yayinlanmaz)
        run: python scripts/check.py
      - name: Degisiklikleri yayinla
        run: |
          git config user.name "analiz365-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data lig sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          # Depo sismesin: veri islemesi tek bir "Bulten guncellendi" kaydi olarak yenilenir
          if [ "$(git log -1 --pretty=%s)" = "Bulten guncellendi" ]; then
            git commit --amend --no-edit --date=now
            git push --force-with-lease
          else
            git commit -m "Bulten guncellendi"
            git push
          fi
      - name: Sonuclandirma zincirini kolla (durduysa yeniden baslat)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --workflow sonuclandir.yml -L 10 --json status               --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 1)
          if [ "$n" = "0" ]; then
            echo "sonuclandirma zinciri calismiyor: yeniden baslatiliyor"
            gh workflow run sonuclandir.yml --ref main
          else
            echo "sonuclandirma zinciri calisiyor ($n)"
          fi
